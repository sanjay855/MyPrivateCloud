<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Private Cloud</title>
</head>
<body style="margin:0;min-height:100vh;background:#EAEFF2;color:#14212B;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;">

  <main style="width:100%;max-width:380px;background:#FFFFFF;border-radius:20px;padding:32px 28px;box-sizing:border-box;box-shadow:0 1px 2px rgba(20,33,43,.06),0 12px 32px rgba(20,33,43,.08);">

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <div style="width:44px;height:44px;border-radius:12px;background:#0F6E7A;display:flex;align-items:flex-end;justify-content:center;padding:8px;box-sizing:border-box;">
        <div style="width:100%;height:55%;background:#9FE3EA;border-radius:4px 4px 6px 6px;"></div>
      </div>
      <div>
        <div style="font-size:20px;font-weight:700;letter-spacing:-.01em;">Private Cloud</div>
        <div style="font-size:13px;color:#5B6B77;">Your files, behind a password</div>
      </div>
    </div>

    <!-- Flask: POST /login with field name="password". On a wrong password, redirect to /login?error=1 -->
    <form method="POST" action="/login" style="margin:0;">
      <label for="password" style="display:block;font-size:14px;font-weight:600;margin-bottom:8px;">Password</label>
      <input id="password" type="password" name="password" required autofocus autocomplete="current-password" placeholder="Enter your cloud password"
        style="width:100%;box-sizing:border-box;padding:14px 14px;font-size:16px;border:1.5px solid #C9D3DA;border-radius:12px;background:#F7F9FA;color:#14212B;margin-bottom:12px;">

      <div id="error" role="alert" style="display:none;background:#FCEBEA;color:#9B1C14;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px;">
        That password didn’t match. Try again.
      </div>

      <button type="submit" style="width:100%;padding:14px;font-size:16px;font-weight:600;color:#FFFFFF;background:#0F6E7A;border:0;border-radius:12px;cursor:pointer;">
        Sign in
      </button>
    </form>
	<hr style="margin: 1.5rem 0; border-color: #334155;">
<div style="text-align: left;">
  <label style="font-size: 0.85rem; color: #94a3b8;">Friend / Recruiter Preview?</label>
  <div style="display: flex; gap: 8px; margin-top: 6px;">
    <input type="text" id="guestName" placeholder="Enter your name" style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff;">
    <button type="button" onclick="requestGuestAccess()" style="padding: 8px 12px; border-radius: 6px; background: #0ea5e9; color: #fff; border: none; cursor: pointer;">Request Link</button>
  </div>
  <p id="guestStatus" style="font-size: 0.8rem; color: #38bdf8; margin-top: 6px;"></p>
</div>

<script>
async function requestGuestAccess() {
  const name = document.getElementById("guestName").value.trim();
  const statusEl = document.getElementById("guestStatus");
  if (!name) { statusEl.textContent = "Please enter your name first."; return; }
  const res = await fetch("/request-guest", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name })
  });
  const data = await res.json();
  statusEl.textContent = data.message || data.error;
}
</script>
    <p style="margin:20px 0 0;font-size:12.5px;line-height:1.5;color:#5B6B77;text-align:center;">
      Only people with the password can view, upload or download files.
    </p>
  </main>

  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
